[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-mem-graph"
version = "0.1.0"
description = "Graph-based external memory research codebase"
requires-python = "==3.10.*"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=2.2",
    "networkx>=3.2",
    "openai>=1.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["graph_mem*"]
