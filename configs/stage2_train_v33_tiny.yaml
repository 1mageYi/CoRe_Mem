project:
  name: core_mem_v33_tiny
  stage: stage2

runtime:
  hf_cache:
    root: .cache/huggingface/stage2_train_v33_tiny

model:
  backbone: __tiny_debug_seq2seq__
  query_encoder_share_backbone: true
  task_adapters:
    enabled: true
    names:
      retrieval_alignment: temporal_latent_adapter
      lifecycle_prediction: learned_write_adapter
      composition_to_belief: belief_graph_adapter
  modular_heads:
    write:
      type: competition_learned_write
    latent:
      type: temporal_semantic_latent_reader
    belief:
      type: belief_graph_head
    answer:
      type: answer_option_head
  resampler:
    top_k: 4
    latent_queries: 4
    slot_tokens: 4
    hidden_dim: 64
    layers: 1
    heads: 4
    dropout: 0.0
  lora:
    rank: 4
    alpha: 8
    dropout: 0.0
    target_modules:
      - q
      - v

training:
  online_aligned: true
  tasks:
    - retrieval_alignment
    - lifecycle_prediction
    - composition_to_belief
  batching:
    per_device_batch_size: 2
    gradient_accumulation_steps: 1
    num_train_epochs: 1
    max_source_length: 160
    max_target_length: 128
  optimizer:
    lr: 0.001
    weight_decay: 0.0
  outputs:
    root: outputs_v2
    checkpoint_dir: outputs_v2/checkpoints
    run_dir: outputs_v2/runs

data:
  prepared_manifest: outputs_v2/artifacts/stage2_prepared_samples_manifest.json
