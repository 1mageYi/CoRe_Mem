project:
  name: core_mem_v33_latent
  stage: stage2

model:
  modular_heads:
    write:
      type: competition_learned_write
    latent:
      type: temporal_semantic_latent_reader
    belief:
      type: belief_graph_head
    answer:
      type: answer_option_head
  latent_objective:
    hidden_dim: 64
    latent_dim: 32
    latent_queries: 8

training:
  latent_objective:
    batch_size: 96
    lr: 0.0006
    num_train_epochs: 10
