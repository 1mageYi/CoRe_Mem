project:
  name: core_mem
  stage: stage2
llm:
  provider: openai_compatible
  api_key_env: GPT_AGENT_API_KEY
  base_url: https://gpt-agent.cc/v1
  model: MiniMax-M2.7
  temperature: 0.0
  max_tokens: 512
  timeout_seconds: 45
  max_retries: 5
  retry_backoff_seconds: 4.0
  min_request_interval_seconds: 0.0
  max_retry_delay_seconds: 60.0
embedding:
  provider: sentence_transformers
  model_name: sentence-transformers/all-MiniLM-L6-v2
  normalize: true
  device: cpu
benchmarks:
  primary: personamem
  secondary: longmemeval_s
  personamem:
    data_root: data/personamem
    variant: 32k
    task: multiple_choice
  longmemeval:
    data_root: data/longmemeval
    subset: s
outputs:
  root: outputs_v2
